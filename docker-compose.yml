# Compose (prod): docker compose --file=./docker-compose.yml --project-name "nestjs-base-template" --env-file=./.env up -d
# Compose (dev): docker compose --file=./docker-compose.yml --project-name "nestjs-base-template" --env-file=./.env.dev up -d
# Healthcheck: docker inspect nestjs-base-template.pgadmin --format='{{.State.Health}}'
version: '3.9'
services:
  nestjs-base-template.postgres:
    image: postgres:14-alpine
    # restart: always # Авторестарт контейнера
    container_name: nestjs-base-template.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - nestjs-base-template:/data/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nestjs-base-template.pgadmin:
    image: dpage/pgadmin4
    # restart: always # Авторестарт контейнера
    container_name: nestjs-base-template.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    # Указываем зависимость от сервиса (данный сервис стартует только)
    # после того, как будет запущен сервис, который указан в зависимости
    depends_on:
      - nestjs-base-template.postgres

volumes:
  nestjs-base-template:
